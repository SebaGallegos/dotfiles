source = $HOME/.config/hypr/themes/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = FiraCode Nerd Font

general {
  hide_cursor = true
}

# LAYOUT
label {
  monitor = DP-1
  text = Layout: $LAYOUT
  color = $text
  font_size = 12
  font_family = $font
  position = 30, 30
  halign = left
  valign = bottom
}

# TIME
label {
  monitor = DP-1
  text = $TIME
  color = $text
  font_size = 70
  font_family = $font
  position = 30, -15
  halign = left
  valign = top
}

# DATE
label {
  monitor = DP-1
  text = cmd[update:43200000] date +"%A, %d %B de %Y"
  color = $text
  font_size = 20
  font_family = $font
  position = 32, -125
  halign = left
  valign = top
}

background {
  monitor =
    path = ~/Pictures/wallpaper/2.jpg
    #color = $base #rgba(25, 20, 20, 1.0) # Fondo negro sólido
    blur_passes = 1
}

# USER INFO LABEL
label {
  monitor = DP-1
  text =     Logged in as $USER
  color = $text
  font_size = 13
  font_family = $font
  position = 30, -10
  halign = left
  valign = center
  shadow_passes = 0
}

# INPUT FIELD
input-field {
  monitor = DP-1
  size = 300, 45
  outline_thickness = 3
  rounding = 0
  dots_size = 0.25
  dots_spacing = 0.25
  dots_center = false
  outer_color = $overlay0
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = 
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgb(ffffff)
  position = 30, -55
  halign = left
  valign = center
}

